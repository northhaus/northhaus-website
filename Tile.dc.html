<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<button onClick="{{ onClick }}" aria-label="{{ title }}" style="display:block;width:100%;border:none;padding:0;margin:0;background:none;cursor:pointer;text-align:left;font-family:inherit">
  <div style="position:relative;width:100%;padding-top:{{ pad }};border-radius:10px;overflow:hidden;background:linear-gradient(150deg,{{ tint }},#0d0e10);box-shadow:0 1px 0 rgba(255,255,255,.05) inset">
    <span style="position:absolute;top:12px;left:14px;font-family:'SharpSansDisplay','Helvetica Neue',sans-serif;font-weight:900;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#FBF8F3;opacity:.72">{{ tag }}</span>
    <sc-if value="{{ video }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px">&#9654;</span></sc-if>
    <span style="position:absolute;right:14px;bottom:56px;font-family:'SharpSansDisplay','Helvetica Neue',sans-serif;font-weight:900;font-size:46px;line-height:1;color:rgba(255,255,255,.12)">{{ num }}</span>
    <span style="position:absolute;left:14px;right:14px;bottom:13px;display:block">
      <span style="display:block;font-family:'Outfit',Inter,sans-serif;font-weight:600;font-size:15px;line-height:1.25;color:#FBF8F3;text-wrap:pretty">{{ title }}</span>
      <span style="display:block;font-size:12px;color:rgba(255,255,255,.6);margin-top:3px">{{ client }}</span>
    </span>
  </div>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:240},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Project title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;client&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Client&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Report&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#12343b&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pad&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;75%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;video&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
